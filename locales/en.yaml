agentSkillPage:
  title: Agent Skill Management
  hint:
    implementation: Native Skills are implemented in Go; Portable Skills come from standard Agent Skills packages. Both use the same Runtime, Tool permissions, Tasks, and audit trail.
    portable: Only Agent Skills compliant ZIP files or a single SKILL.md are accepted. Package scripts cannot execute by default; allowed-tools are author requests and are never granted automatically.
    file: A ZIP may contain skill-name/SKILL.md or SKILL.md at its root. A single-file upload must be named SKILL.md.
    directory: Enter only a relative path below the configured agent_skills.import_dir. Arbitrary server absolute paths are not allowed.
    allowedTools: allowed-tools are requested pre-approvals, not system grants. A Tool enters the runtime allowlist only after an administrator explicitly grants it; high-risk Tools remain subject to global Runtime Policy.
    chatEnabled: Controls only whether this Skill is available in Chat; background tasks, schedulers, and alert pipelines are unaffected.
