    description:
      ma: Averages prices to identify trend direction and support or resistance.
      ema: Weights recent prices more heavily to detect trend changes faster.
      macd: Compares fast and slow averages to show trend and momentum changes.
      adx: Measures trend strength and uses directional lines to indicate direction.
      mfi: Combines price and volume to measure buying and selling pressure.
      obv: Accumulates directional volume to confirm whether volume supports a trend.
      cci: Measures price deviation from its average to identify strength and extremes.
      roc: Calculates the price change rate over a period to measure momentum.
      kdj: Compares the close with its recent range to show momentum and extremes.
      rsi: Measures momentum to identify overbought and oversold conditions.
      kc: Uses an average and volatility bands to identify trends and breakouts.
      boll: Uses standard-deviation bands to show volatility and breakouts.
      donchian: Uses period highs and lows to form a channel for breakout detection.
      atr: Measures market volatility without indicating price direction.
      supertrend: Combines ATR and price into a trend line to identify trend changes.
