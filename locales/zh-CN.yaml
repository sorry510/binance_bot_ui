    kPeriod: K平滑周期
    dPeriod: D平滑周期
    multiplier: 乘数
    stdDevMultiplier: 标准差乘数
    enable: 启用
    description:
      ma: 均线平滑价格，用于判断趋势方向和支撑阻力。
      ema: 加重近期价格权重，用于更快识别趋势变化。
      macd: 比较快慢均线差异，用于观察趋势和动能变化。
      adx: 衡量趋势强度，并用正负方向线辅助判断方向。
      mfi: 结合价格与成交量，判断资金流入流出强弱。
      obv: 累计成交量方向，用于验证价格趋势是否得到量能支持。
      cci: 衡量价格偏离均值的程度，用于识别强弱与极端区间。
      roc: 计算一定周期价格变化率，用于衡量涨跌动能。
      kdj: 比较收盘价与近期区间，用于判断动能和超买超卖。
      rsi: 衡量涨跌动能强弱，用于识别超买和超卖区间。
      kc: 以均线和波动率构建通道，用于判断趋势与突破。
      boll: 以标准差构建价格通道，用于观察波动与突破。
      donchian: 取周期最高价和最低价形成通道，用于识别突破。
      atr: 衡量市场波动幅度，不直接判断价格涨跌方向。
      supertrend: 结合 ATR 与价格生成趋势线，用于识别趋势切换。
